name: CI                        # nom affiché dans l'onglet Actions

on:                             
  pull_request:                 # à chaque PR
    branches: [master]            # qui vise la branche master
  push:
    branches: [master]            # + aussi sur push direct sur master comme ça on évite que mon mauvais code casse tout

jobs:
  # ---------- BACKEND GO ----------
  build-backend:
    runs-on: ubuntu-latest      # machine virtuelle Linux fournie par GitHub
    steps:
      - uses: actions/checkout@v4        # 1. cloner le code de la PR

      - uses: actions/setup-go@v5        # 2. installer Go
        with:
          go-version: '1.26'

      - name: Build                      # 3. compiler (échoue si ça build pas)
        working-directory: ./backend     # entrer dans le dossier backend
        run: go build ./...

      - name: Vet                        # 4. (bonus) analyse statique
        working-directory: ./backend
        run: go vet ./...

  # ---------- FRONTEND SVELTEKIT ----------
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4      # installer Node
        with:
          node-version: '22'
          cache: 'npm'                   # cache pour aller plus vite
          cache-dependency-path: todo/package-lock.json

      - name: Install
        working-directory: ./todo
        run: npm ci                      # installe exactement le package-lock

      - name: Build
        working-directory: ./todo
        run: npm run build               # échoue si le build casse